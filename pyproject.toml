[project]
name = "django-keycloak-oidc-auth"
version = "0.1.1"
description = "Keycloak OIDC authentication for Django"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [
  { name = "Jeniks" }
]
keywords = ["django", "keycloak", "oidc", "authentication", "sso"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Django",
  "Framework :: Django :: 4.2",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "Django>=4.2",
  "mozilla-django-oidc>=2.0.0",
  "requests>=2.28.0",
]

[project.urls]
Homepage = "https://github.com/JenIK-s/django-keycloak-oidc-auth"
Repository = "https://github.com/JenIK-s/django-keycloak-oidc-auth"
Issues = "https://github.com/JenIK-s/django-keycloak-oidc-auth"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["django_keycloak_oidc_auth"]

[tool.hatch.build.targets.sdist]
include = [
  "/django_keycloak_oidc_auth",
  "/README.md",
  "/pyproject.toml",
]
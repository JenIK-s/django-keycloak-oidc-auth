[project]
name = "django_keycloak_oidc"  # уникальное имя
version = "0.1.0"
description = "Keycloak OIDC authentication for Django"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "JenIKs", email = "fertuv68@gmail.com" }]
dependencies = [
    "Django>=4.0",
    "django-mozilla-oidc>=2.0.0",
    "requests>=2.28.0",
]

[project.urls]
Homepage = "https://github.com/JenIK-s/django_keycloak_oidc"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["django_keycloak"]